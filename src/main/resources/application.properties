# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8082}

# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.upload.dir=${APP_UPLOAD_DIR:uploads}

# THYMELEAF
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}

# AI provider keys (never commit real secrets)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.model=${OPENROUTER_API_MODEL:openai/gpt-4o-mini}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}

openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_API_MODEL:gpt-4o-mini}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

# OAUTH2 GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8082/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.user-name-attribute=email
