<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="app-hero d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
      <h3 class="mb-1">Danh mục</h3>
      <div class="app-muted">Quản lý nhóm sách. Không cho xóa khi còn sách liên quan.</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" th:href="@{/admin/categories/new}">Thêm danh mục</a>
      <form th:action="@{/admin/categories/cleanup-empty}" method="post" class="mb-0"
            onsubmit="return confirm('Xóa tất cả danh mục trống?');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-danger" type="submit">Xóa danh mục trống</button>
      </form>
    </div>
  </div>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="app-card p-0">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Tên</th>
          <th class="text-center">Số sách</th>
          <th class="text-end">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${categoryPage == null or #lists.isEmpty(categoryPage.content)}">
          <td colspan="4" class="text-center text-muted py-3">Chưa có danh mục.</td>
        </tr>
        <tr th:each="c : ${categoryPage.content}">
          <td th:text="${c.id}"></td>
          <td th:text="${c.name}"></td>
          <td class="text-center" th:text="${categoryCounts[c.id] ?: 0}"></td>
          <td class="text-end">
            <div class="d-inline-flex gap-2">
              <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/categories/{id}/edit(id=${c.id})}">Sửa</a>

              <a class="btn btn-outline-danger btn-sm"
                 th:if="${(categoryCounts[c.id] ?: 0) > 0}"
                 th:href="@{/admin/categories/{id}/confirm-delete(id=${c.id})}"
                 th:title="'Còn ' + (categoryCounts[c.id] ?: 0) + ' sách - cần chuyển trước khi xóa'">
                Chuyển/Xóa
              </a>

              <form th:if="${(categoryCounts[c.id] ?: 0) == 0}"
                    th:action="@{/admin/categories/{id}/delete(id=${c.id})}"
                    method="post"
                    class="mb-0"
                    onsubmit="return confirm('Xóa danh mục này?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-danger btn-sm" type="submit">Xóa</button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3" th:if="${categoryPage != null}">
    <div class="text-muted small">
      Trang <span th:text="${categoryPage.number + 1}"></span>/<span th:text="${categoryPage.totalPages}"></span>
      - Tổng <span th:text="${categoryPage.totalElements}"></span> danh mục
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${categoryPage.first} ? ' disabled'"
         th:href="@{/admin/categories(page=${categoryPage.number - 1}, size=${categoryPage.size}, sort=${sort}, dir=${dir})}">
        « Trước
      </a>
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${categoryPage.last} ? ' disabled'"
         th:href="@{/admin/categories(page=${categoryPage.number + 1}, size=${categoryPage.size}, sort=${sort}, dir=${dir})}">
        Sau »
      </a>
    </div>
  </div>
</div>
