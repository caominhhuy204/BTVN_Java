<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="app-hero d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
      <h3 class="mb-1">Mã giảm giá</h3>
    </div>
  </div>

  <div class="app-card p-3 p-md-4 mb-3">
    <div th:if="${message != null}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="${coupon.id} != null ? @{/admin/coupons/{id}(id=${coupon.id})} : @{/admin/coupons}" method="post" class="row g-3 align-items-end">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="col-12" th:if="${coupon.id != null}">
        <div class="alert alert-info py-2 mb-0">Đang chỉnh sửa mã <span class="fw-semibold" th:text="${coupon.code}"></span></div>
      </div>
      <div class="col-md-2">
        <label class="form-label">Mã</label>
        <input class="form-control" name="code" placeholder="SAVE20" th:value="${coupon.code}" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Số tiền giảm (₫)</label>
        <input class="form-control" type="number" name="amount" min="0" step="1000" th:value="${coupon.amount}" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Số lượng</label>
        <input class="form-control" type="number" name="quantity" min="0" step="1" th:value="${coupon.quantity}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Bắt đầu</label>
        <input class="form-control" type="datetime-local" name="startAt" th:value="${coupon.startAt != null ? #temporals.format(coupon.startAt, 'yyyy-MM-dd''T''HH:mm') : ''}">
      </div>
      <div class="col-md-3">
        <label class="form-label">Kết thúc</label>
        <input class="form-control" type="datetime-local" name="endAt" th:value="${coupon.endAt != null ? #temporals.format(coupon.endAt, 'yyyy-MM-dd''T''HH:mm') : ''}">
      </div>
      <div class="col-md-2 form-check mt-4">
        <input class="form-check-input" type="checkbox" name="active" id="active" th:checked="${coupon.active}">
        <label class="form-check-label" for="active">Kích hoạt</label>
      </div>
      <div class="col-md-2 d-grid">
        <button class="btn btn-primary" type="submit" th:text="${coupon.id} != null ? 'Lưu' : 'Tạo mã'"></button>
      </div>
      <div class="col-md-2 d-grid" th:if="${coupon.id != null}">
        <a class="btn btn-outline-secondary" href="#" th:href="@{/admin/coupons}">Huỷ</a>
      </div>
    </form>
  </div>

  <div class="app-card p-3 p-md-4">
    <div th:if="${#lists.isEmpty(coupons)}" class="text-muted">Chưa có mã nào.</div>
    <div th:if="${!#lists.isEmpty(coupons)}" class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>Mã</th>
          <th class="text-end">Số tiền</th>
          <th>Trạng thái</th>
          <th>Bắt đầu</th>
          <th>Kết thúc</th>
          <th>Ngày tạo</th>
          <th class="text-end">Số lượng</th>
          <th class="text-end">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${coupons}">
          <td class="fw-semibold" th:text="${c.code}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(c.amount,1,'COMMA',0,'POINT')} + ' ₫'"></td>
          <td>
            <span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-secondary'"
                  th:text="${c.active ? 'Active' : 'Inactive'}"></span>
          </td>
          <td th:text="${c.startAt != null ? #temporals.format(c.startAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td th:text="${c.endAt != null ? #temporals.format(c.endAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
          <td class="text-end" th:text="${c.quantity}"></td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary me-1" th:href="@{/admin/coupons/{id}/edit(id=${c.id})}">Sửa</a>
            <form th:action="@{/admin/coupons/{id}/toggle(id=${c.id})}" method="post" class="d-inline">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-sm" th:classappend="${c.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                      th:text="${c.active} ? 'Tắt' : 'Bật'"></button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
