<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="app-hero d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
      <h3 class="mb-1">Đơn hàng khách</h3>
      <div class="app-muted">Theo dõi lịch sử mua hàng toàn hệ thống.</div>
    </div>
  </div>

  <div class="app-card p-3 p-md-4">
    <div th:if="${message != null}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="text-muted">Chưa có đơn hàng nào.</div>

    <div th:if="${!#lists.isEmpty(orders)}" class="table-responsive">
      <table class="table align-middle table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Khách</th>
          <th>Thời gian</th>
          <th>Trạng thái</th>
          <th style="min-width: 320px;">Cập nhật nhanh</th>
          <th>Giao hàng</th>
          <th class="text-end">Tổng</th>
          <th class="text-end">Số mục</th>
          <th class="text-end">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="${o.id}"></td>
          <td th:text="${o.user != null ? o.user.username : 'Khách'}"></td>
          <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
          <td>
            <div th:switch="${o.status}">
              <span class="badge text-bg-secondary" th:case="'CREATED'">Mới tạo</span>
              <span class="badge text-bg-info" th:case="'CONFIRMED'">Đã xác nhận</span>
              <span class="badge text-bg-warning" th:case="'SHIPPED'">Đang giao</span>
              <span class="badge text-bg-success" th:case="'DELIVERED'">Giao thành công</span>
              <span class="badge text-bg-secondary" th:case="'CANCELLED'">Đã hủy</span>
              <span class="badge text-bg-dark" th:case="'REFUNDED'">Hoàn tiền</span>
              <span class="badge text-bg-light text-dark" th:case="*"
                    th:text="${o.status ?: 'Khác'}"></span>
            </div>
            <div class="small text-muted" th:text="${o.statusUpdatedAt != null ? #temporals.format(o.statusUpdatedAt, 'dd/MM/yyyy HH:mm') : '-'}"></div>
          </td>
          <td>
            <div class="row g-1">
              <div class="col-6">
                <select class="form-select form-select-sm" name="status" form="status-form-[[${o.id}]]">
                  <option value="CREATED" th:selected="${o.status == 'CREATED'}">Mới tạo</option>
                  <option value="CONFIRMED" th:selected="${o.status == 'CONFIRMED'}">Đã xác nhận</option>
                  <option value="SHIPPED" th:selected="${o.status == 'SHIPPED'}">Đang giao</option>
                  <option value="DELIVERED" th:selected="${o.status == 'DELIVERED'}">Giao thành công</option>
                  <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Đã hủy</option>
                  <option value="REFUNDED" th:selected="${o.status == 'REFUNDED'}">Hoàn tiền</option>
                </select>
              </div>
              <div class="col-6">
                <input class="form-control form-control-sm" type="text" name="adminNote" placeholder="Ghi chú" th:value="${o.adminNote}" form="status-form-[[${o.id}]]">
              </div>
            </div>
          </td>
          <td>
            <div class="small fw-semibold" th:text="${o.shippingName} ?: '-'"></div>
            <div class="small text-muted" th:text="${o.shippingPhone} ?: '-'"></div>
            <div class="badge bg-light text-dark" th:text="${o.paymentMethod} ?: 'COD'"></div>
            <div class="small text-muted" th:if="${o.couponCode != null}" th:text="'Mã: ' + ${o.couponCode}"></div>
          </td>
          <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')} + ' ₫'"></td>
          <td class="text-end" th:text="${#lists.size(o.items)}"></td>
          <td class="text-end">
            <form th:id="${'status-form-' + o.id}" th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="d-none">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
            <div class="d-flex align-items-center justify-content-end gap-2">
              <button class="btn btn-sm btn-primary" type="submit" th:form="${'status-form-' + o.id}">Lưu</button>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/orders/{id}(id=${o.id})}">Xem chi tiết</a>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
