<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="app-hero d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
      <h3 class="mb-1">Đơn hàng #<span th:text="${order.id}"></span></h3>
      <div class="app-muted">Theo dõi trạng thái và chi tiết đơn hàng của bạn.</div>
    </div>
    <div class="text-end">
      <div class="badge-soft" th:text="${order.status}">CREATED</div>
      <div class="text-muted small" th:text="'Cập nhật: ' + ${#temporals.format(order.statusUpdatedAt, 'dd/MM/yyyy HH:mm')}"></div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="app-card h-100 p-3 p-md-4">
        <h6 class="fw-semibold mb-3">Thông tin giao hàng</h6>
        <div class="mb-2"><strong>Người nhận:</strong> <span th:text="${order.shippingName}"></span></div>
        <div class="mb-2"><strong>Điện thoại:</strong> <span th:text="${order.shippingPhone}"></span></div>
        <div class="mb-2"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></div>
        <div class="mb-2"><strong>Thanh toán:</strong> <span th:text="${order.paymentMethod} ?: 'COD'"></span></div>
        <div th:if="${order.adminNote}" class="alert alert-info mt-3 mb-0">
          <strong>Ghi chú từ shop:</strong> <span th:text="${order.adminNote}"></span>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="app-card h-100 p-3 p-md-4">
        <h6 class="fw-semibold mb-3">Tổng quan</h6>
        <div class="d-flex justify-content-between mb-2">
          <span>Tạm tính</span>
          <span th:text="${#numbers.formatDecimal(order.totalAmount + order.discount - order.shippingFee,1,'COMMA',2,'POINT')} + ' ₫'"></span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Phí vận chuyển</span>
          <span th:text="${#numbers.formatDecimal(order.shippingFee,1,'COMMA',0,'POINT')} + ' ₫'"></span>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Giảm giá <small th:if="${order.couponCode}" th:text="'(' + order.couponCode + ')'"></small></span>
          <span th:text="'- ' + ${#numbers.formatDecimal(order.discount,1,'COMMA',0,'POINT')} + ' ₫'"></span>
        </div>
        <hr>
        <div class="d-flex justify-content-between fw-semibold">
          <span>Tổng thanh toán</span>
          <span th:text="${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')} + ' ₫'"></span>
        </div>
        <div class="mt-3">
          <div class="small text-muted">Tạo lúc: <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div>
          <div class="small text-muted">Cập nhật: <span th:text="${#temporals.format(order.statusUpdatedAt, 'dd/MM/yyyy HH:mm')}"></span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-card mt-3 p-3 p-md-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-semibold mb-0">Sản phẩm</h6>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/orders}">Quay lại danh sách</a>
    </div>
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
        <tr>
          <th>Tiêu đề</th>
          <th>Tác giả</th>
          <th class="text-end">Giá</th>
          <th class="text-end">SL</th>
          <th class="text-end">Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="it : ${order.items}">
          <td th:text="${it.title}"></td>
          <td th:text="${it.author}">-</td>
          <td class="text-end" th:text="${#numbers.formatDecimal(it.price,1,'COMMA',2,'POINT')} + ' ₫'"></td>
          <td class="text-end" th:text="${it.quantity}"></td>
          <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(it.lineTotal,1,'COMMA',2,'POINT')} + ' ₫'"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
