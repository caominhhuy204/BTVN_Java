<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <div class="app-hero d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
      <h3 class="mb-1">Lịch sử đơn hàng</h3>
      <div class="app-muted">Xem các đơn đã đặt từ giỏ hàng.</div>
    </div>
  </div>

  <div class="app-card p-3 p-md-4">
    <div th:if="${#lists.isEmpty(orders)}" class="text-muted">Chưa có đơn hàng nào.</div>

    <div th:if="${!#lists.isEmpty(orders)}" class="vstack gap-3">
      <div th:each="o : ${orders}" class="border rounded-3 p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <div class="fw-semibold">Đơn #<span th:text="${o.id}"></span></div>
            <div class="text-muted small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
            <div class="small text-muted mt-1">
              <span th:text="${o.shippingName}">-</span> |
              <span th:text="${o.shippingPhone}">-</span>
            </div>
            <div class="small text-muted" th:text="${o.shippingAddress}"></div>
            <div class="badge bg-light text-dark mt-1" th:text="'Thanh toán: ' + (${o.paymentMethod} ?: 'COD')"></div>
          </div>
          <div class="text-end">
            <div class="badge-soft" th:text="${o.status}">CREATED</div>
            <div class="text-muted small" th:if="${o.couponCode != null}" th:text="'Mã: ' + ${o.couponCode}"></div>
            <div class="text-muted small" th:text="'Phí ship: ' + ${#numbers.formatDecimal(o.shippingFee,1,'COMMA',0,'POINT')} + ' ₫'"></div>
            <div class="text-muted small" th:text="'Giảm giá: -' + ${#numbers.formatDecimal(o.discount,1,'COMMA',0,'POINT')} + ' ₫'"></div>
            <div class="fw-bold" th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')} + ' ₫'"></div>
            <a class="btn btn-sm btn-outline-primary mt-2" th:href="@{/orders/{id}(id=${o.id})}">Xem chi tiết</a>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
            <tr>
              <th>Tiêu đề</th>
              <th>Tác giả</th>
              <th class="text-end">Giá</th>
              <th class="text-end">SL</th>
              <th class="text-end">Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="it : ${o.items}">
              <td th:text="${it.title}"></td>
              <td th:text="${it.author}">-</td>
              <td class="text-end" th:text="${#numbers.formatDecimal(it.price,1,'COMMA',2,'POINT')} + ' ₫'"></td>
              <td class="text-end" th:text="${it.quantity}"></td>
              <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(it.lineTotal,1,'COMMA',2,'POINT')} + ' ₫'"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
